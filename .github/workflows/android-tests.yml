name: Android Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build, lint, unit-test, and verify coverage
        # Pulls all unit-side gates in a single Gradle invocation so the JVM
        # starts once. `verifyCoverageThreshold` already depends on
        # testDebugUnitTest + createDebugUnitTestCoverageReport, so listing it
        # is sufficient for the unit suite.
        run: >
          ./gradlew
          :app:lintDebug
          :app:assembleDebug
          :app:verifyCoverageThreshold
          --stacktrace

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest

      - name: Upload unit coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage-report
          path: app/build/reports/coverage/test/debug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug*

  instrumentation-tests:
    name: Instrumentation Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    # Heavy device-emulator job. Runs on push-to-main and via manual
    # `workflow_dispatch` only — never on PRs — to keep GitHub Actions
    # minutes manageable. Open a PR with a quick `gh workflow run
    # android-tests.yml` if you need a device check on a branch.
    if: github.event_name != 'pull_request'
    timeout-minutes: 35
    # Fail-safe: short-circuit `Terminate Emulator` to the time it actually
    # needs (~2 s) rather than the default 20 s grace period that the
    # hung-emulator state on API 30+ AOSP images stretches out.
    env:
      ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 2
    strategy:
      # `minSdk = 26` is the contractual floor; 30 catches the
      # mainstream-Compose surface. `aosp-atd` (Android Test Device — fastest
      # to boot) is only published for API 30+, so API 26 uses the regular
      # AOSP `default` image. Add a row here to lock behaviour on newer images.
      fail-fast: false
      matrix:
        include:
          - api-level: 26
            target: default
          - api-level: 30
            # `aosp_atd` (underscore) is the sdkmanager package suffix —
            # AGP's `systemImageSource` uses `aosp-atd` (hyphen), but the
            # emulator-runner pipes this string straight into
            # `system-images;android-30;<target>;x86_64` which only resolves
            # with the underscore form.
            target: aosp_atd
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          # Include arch + target in the cache key so changing image flavour
          # invalidates the cache automatically.
          key: avd-${{ matrix.api-level }}-${{ matrix.target }}-x86_64

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: ${{ matrix.target }}
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "Generated AVD snapshot."

      - name: Run instrumentation tests and coverage gate
        # Hard step-level cap so a hung `Terminate Emulator` post-step can
        # never burn the full 35-min job budget — it'll fail this step at
        # 22 min instead and let artifact-upload steps still run.
        timeout-minutes: 22
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: ${{ matrix.target }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # Run the Gradle gate, then explicitly tear the emulator down
          # ourselves. The action's post-step `Terminate Emulator` is known
          # to hang on API 30+ AOSP images ("ERROR | stop: Not implemented"
          # + "client has not yet been configured"). Killing the emulator
          # process up-front means the post-step finds nothing to wait on
          # and returns instantly.
          script: |
            set -e
            ./gradlew :app:verifyAndroidTestCoverageThreshold --stacktrace
            echo "Tests finished — tearing down emulator before post-step."
            adb -s emulator-5554 emu kill || true
            sleep 2
            # Match by process `comm` (no `-f`). The emulator-runner action
            # executes each script line as its own `sh -c <line>`, so a
            # `pkill -f "qemu-system"` would match the wrapping shell's own
            # argv and SIGKILL its parent — the step then exits with code
            # `null` even though tests passed. Linux truncates comm to 15
            # chars: qemu-system-x86_64 → qemu-system-x86,
            # emulator64-crash-service → emulator64-cras.
            pkill -9 qemu-system-x86 2>/dev/null || true
            pkill -9 emulator64-cras 2>/dev/null || true
            # Kill the adb server too. `adb` auto-forks a daemon on :5037 that
            # inherits this step's stdout file descriptor; the Actions runner
            # blocks the step until every writer on that pipe is gone, so a
            # surviving adb server keeps the step open until the 22-min
            # timeout fires — long after the emulator itself is dead (the
            # post-step's `adb emu kill` already gets "Connection refused").
            adb kill-server 2>/dev/null || true

      - name: Upload instrumentation test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-test-report-api-${{ matrix.api-level }}
          path: app/build/reports/androidTests/connected

      - name: Upload instrumented coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-coverage-report-api-${{ matrix.api-level }}
          path: app/build/reports/coverage/androidTest
