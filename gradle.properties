# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
android.disallowKotlinSourceSets=false
# Enable parallel builds
org.gradle.parallel=true

# Enable the Gradle daemon
org.gradle.daemon=true

# Gradle Managed Devices (GMD) on host emulator 36.5.11 rejects AGP's default
# `-gpu auto-no-window`. AGP 9.2.1 has no public DSL or experimental flag to
# override the GPU mode passed to `emulator` (verified: the property below was
# tried and the emulator subprocess still received `auto-no-window`). Two
# workarounds today:
#   1. Launch an AVD manually with `-gpu swiftshader_indirect` and use
#      `:app:connectedDebugAndroidTest` instead of GMD.
#   2. Pin the SDK `emulator` package to a version that still accepts
#      `auto-no-window` (e.g. 33.x via `sdkmanager --install "emulator;<v>"`).
# CI uses reactivecircus/android-emulator-runner@v2 which is unaffected.
# android.experimental.testOptions.managedDevices.emulator.gpuMode=swiftshader_indirect